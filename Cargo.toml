[package]
name = "ffgo"
version = "0.1.0"
edition = "2024"
default-run = "ffgo"

[dependencies]
clap = { version = "4.5.56", features = ["derive"] }
isolang = "2.4.0"
notify = "8.2.0"
once_cell = "1.21.3" 
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.9.11"
uuid = { version = "1.20.0", features = ["v4"] }
